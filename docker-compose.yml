version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cratos_db
    environment:
      POSTGRES_USER: cratos_user
      POSTGRES_PASSWORD: cratos_password
      POSTGRES_DB: cratos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
